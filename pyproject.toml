[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "answerability-aware-rag"
version = "0.1.0"
description = "MSc research implementation for answerability-aware RAG evaluation in technical documentation QA"
requires-python = ">=3.10,<3.15"
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "sentence-transformers>=3.0",
  "rank-bm25>=0.2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
  "torch>=2.3",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "jupyter>=1.0",
  "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
